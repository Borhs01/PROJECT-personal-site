<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{%ARTICLE_DESCRIPTION%}">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Meie+Script&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>{%ARTICLE_TITLE%} — Ahmad Auwal</title>
</head>
<body>
{%SHARED_NAVIGATION%}
<main>
    <article class="article">
        <a href="/blog" class="text-link">← Back to all notes</a>
        <header class="article__header">
            <div class="post-meta"><span>{%ARTICLE_CATEGORY%}</span><time>{%ARTICLE_READ_TIME%}</time></div>
            <h1>{%ARTICLE_TITLE%}</h1>
            <p>{%ARTICLE_DESCRIPTION%}</p>
        </header>
        <img class="article__cover" src="{%ARTICLE_IMAGE%}" alt="{%ARTICLE_IMAGE_ALT%}">
        <div class="article__body">{%ARTICLE_BODY%}</div>
    </article>
</main>
<footer class="section__footer"><div class="footer__top"><p>Have a project in mind?</p><h2>Let’s work together.</h2><a href="mailto:ahmadauwal077@gmail.com" class="footer__btn">Get in touch <span>↗</span></a></div><div class="footer__bottom"><span class="footer__bottom__name--text">© <span data-year></span> Ahmad Auwal Abubakar</span><nav class="footer__navigation"><a href="mailto:ahmadauwal077@gmail.com" class="footer__nav__link">Email</a><a href="https://www.linkedin.com/in/ahmad-auwal-42293b286/" class="footer__nav__link">LinkedIn</a><a href="https://github.com/Borhs01" class="footer__nav__link">GitHub</a></nav></div></footer>
<script src="/app.js" defer></script>
</body>
</html>
